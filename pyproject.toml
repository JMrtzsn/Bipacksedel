[project]
name = "drug-label-mcp"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastembed>=0.7,<1",
  "mcp[cli]>=2.3,<3",
  "pgvector>=0.4,<1",
  "psycopg[binary]>=3.2,<4",
]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.14,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/drug_label_mcp"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
markers = ["integration: requires a running PostgreSQL database"]
pythonpath = ["."]
